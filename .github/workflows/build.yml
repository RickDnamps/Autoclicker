name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Uses the private release key when the repository secrets are set
      # (see README, "Publier sur le Play Store"); otherwise builds are signed
      # with a throwaway debug key.
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release key found: APK and AAB are signed for the Play Store."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: signed with a debug key (OK to sideload, refused by the Play Store)."
          fi

      - name: Build APK and App Bundle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk AutoClicker.apk
          cp app/build/outputs/bundle/release/app-release.aab AutoClicker.aab

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-apk
          path: AutoClicker.apk

      # The .aab is the file to upload to the Play Console.
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-play-store-aab
          path: AutoClicker.aab

      # Every build of the default branch is published as a GitHub release so the APK can be
      # downloaded straight from the phone.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: AutoClicker v1.3.${{ github.run_number }}
          files: AutoClicker.apk
